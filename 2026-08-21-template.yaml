AWSTemplateFormatVersion: '2010-09-09'
Description: AI News Agent infra (ECR repositories, SAM artifacts bucket)

# =====================================================================
# AI News Agent 인프라 스택 (스택 이름: ai-news-agent-ecr-<phase>)
#
# 메인 스택(template.yaml)과 분리한 이유:
#   - sam deploy 는 스택 생성 전에 이미지를 ECR에 푸시하므로
#     리포지토리가 메인 스택 소속이면 첫 배포가 성립하지 않음 (순환)
#   - AWS::Serverless transform 스택으로는 기존 리소스 import 미지원
#
# 수행 내역 (자세한 이력/운영 방법은 INFRA.md 참고):
#   - 2026-08-21: 기존 ECR 리포지토리 4개(dev/prod)를 스택으로 편입하고
#     라이프사이클 정책(최신 2개만 유지) 적용. SAM 배포 아티팩트용
#     S3 버킷(30일 만료) 추가.
# =====================================================================

Parameters:
  PROFILE:
    Type: String
    AllowedValues:
      - dev
      - prod
    Description: 배포에 사용할 phase

Resources:
  NewsScraperAgentRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub ai-news-agent/news-scraper-agent-${PROFILE}
      # Lambda가 함수 생성 시 자동으로 붙이는 이미지 pull 정책.
      # 템플릿에서 빠지면 CloudFormation이 실제 리포지토리의 정책을 삭제하므로 반드시 유지해야 한다.
      RepositoryPolicyText:
        Version: '2012-10-17'
        Statement:
          - Sid: LambdaECRImageRetrievalPolicy
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - ecr:BatchGetImage
              - ecr:DeleteRepositoryPolicy
              - ecr:GetDownloadUrlForLayer
              - ecr:GetRepositoryPolicy
              - ecr:SetRepositoryPolicy
            Condition:
              StringLike:
                aws:sourceArn: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:*
      # Lambda가 사용 중인 이미지가 지워지지 않도록 최신 2개(현재 + 롤백용)는 유지
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "keep last 2 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 2
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: PROJECT
          Value: AI_NEWS_AGENT
        - Key: PHASE
          Value: !Ref PROFILE

  # sam deploy 가 템플릿/아티팩트를 업로드하는 버킷.
  # 계정 공용 SAM 버킷(aws-sam-cli-managed-default-*) 대신 사용하며,
  # 배포 시점에만 필요한 파일이므로 30일 후 자동 만료시킨다.
  SamArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ai-news-agent-sam-artifacts-${PROFILE}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-deploy-artifacts
            Status: Enabled
            ExpirationInDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: PROJECT
          Value: AI_NEWS_AGENT
        - Key: PHASE
          Value: !Ref PROFILE

  ScraperLambdaRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub ai-news-agent/scraper-lambda-${PROFILE}
      RepositoryPolicyText:
        Version: '2012-10-17'
        Statement:
          - Sid: LambdaECRImageRetrievalPolicy
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - ecr:BatchGetImage
              - ecr:DeleteRepositoryPolicy
              - ecr:GetDownloadUrlForLayer
              - ecr:GetRepositoryPolicy
              - ecr:SetRepositoryPolicy
            Condition:
              StringLike:
                aws:sourceArn: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:*
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "keep last 2 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 2
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: PROJECT
          Value: AI_NEWS_AGENT
        - Key: PHASE
          Value: !Ref PROFILE
